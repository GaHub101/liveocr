name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/live-ocr-planner-W2hDV]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Apps Script URL
        env:
          VITE_APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          echo "VITE_APPS_SCRIPT_URL=${VITE_APPS_SCRIPT_URL}" > .env.production

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
