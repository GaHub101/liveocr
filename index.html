<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Live OCR Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 0;
      overflow-x: hidden;
    }

    #header {
      width: 100%;
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #3b82f6;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      background: #000;
    }

    #video {
      width: 100%;
      display: block;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    /* Overlay: scanning frame */
    #scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 60%;
      border: 2px solid rgba(59,130,246,0.8);
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    }

    #cam-switch-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 40;
      display: none;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #fff;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #cam-switch-btn:disabled { opacity: 0.5; }

    #zoom-wrap {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 40;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
    }
    #zoom-wrap span { color: #fff; font-size: 0.85rem; }
    #zoom-range { flex: 1; accent-color: #3b82f6; }

    #canvas { display: none; }
    body.debug-mode #canvas {
      display: block;
      width: 100%;
      max-width: 720px;
      border: 2px solid #f59e0b;
      image-rendering: pixelated;
    }

    /* Bestätigung: aufgenommenes scharfes Foto kurz einblenden */
    body #canvas.review {
      display: block;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 420px;
      border: 3px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .55);
      z-index: 50;
    }

    #result-panel {
      width: 100%;
      max-width: 720px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    #status-dot.ready    { background: #22c55e; }
    #status-dot.working  { background: #f59e0b; animation: pulse 1s infinite; }
    #status-dot.error    { background: #ef4444; }
    #status-dot.offline  { background: #f97316; }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    #result-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      min-height: 48px;
    }

    #result-label {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
    }

    #result-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      word-break: break-all;
      letter-spacing: 0.05em;
      min-height: 1.4rem;
    }

    #confidence-bar-wrap {
      margin-top: 4px;
      height: 4px;
      background: #0f172a;
      border-radius: 2px;
      overflow: hidden;
    }

    #confidence-bar {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
    }

    #confidence-label {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 4px;
    }

    #scan-btn, #send-btn, #lookup-btn, #search-confirm-btn,
    #review-send-btn, #review-retake-btn {
      width: 100%;
      padding: 16px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #review-send-btn   { background: #2563eb; margin-bottom: 4px; }
    #review-retake-btn { background: #475569; margin-bottom: 4px; }
    #lookup-btn       { background: #3b82f6; }
    #search-confirm-btn { background: #15803d; margin-bottom: 4px; }

    #search-ref-input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      padding: 8px 12px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0;
    }

    #mode-switcher {
      display: none;
      justify-content: flex-end;
      gap: 4px;
      margin-bottom: 4px;
    }
    .mode-switch-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .mode-switch-btn.active {
      background: #1e40af;
      color: #fff;
      border-color: #3b82f6;
    }

    #scan-btn {
      background: #3b82f6;
      font-size: 1.1rem;
    }

    #scan-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #scan-btn:not(:disabled):active { background: #2563eb; }

    #send-btn {
      background: #1e40af;
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #send-btn:not(:disabled):active { background: #1e3a8a; }

    #queue-info {
      font-size: 0.75rem;
      color: #f97316;
      text-align: center;
      display: none;
    }

    #queue-info.visible { display: block; }

    #avail-panel {
      margin-top: 12px;
      border-top: 1px solid #334155;
      padding-top: 10px;
      width: 100%;
    }

    .avail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }

    .avail-row:last-child { border-bottom: none; }

    .avail-name { font-weight: 500; color: #f1f5f9; }

    .avail-link {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      white-space: nowrap;
    }

    #lookup-btn {
      background: #065f46;
      margin-top: 0;
    }

    #lookup-btn:not(:disabled):active { background: #047857; }

    #reorder-btn {
      width: 100%;
      padding: 16px;
      background: #b45309;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #reorder-btn:not(:disabled):active { background: #92400e; }
    #reorder-btn:disabled { opacity: 0.6; cursor: default; }

    .avail-row--primary {
      background: rgba(245, 158, 11, 0.10);
      border-left: 3px solid #f59e0b;
      padding-left: 8px;
    }
    .avail-row--primary .avail-name { color: #fde68a; font-weight: 600; }
    .avail-row--primary .avail-name::before { content: '★ '; color: #f59e0b; }

    #lookup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 16px;
    }

    /* Titel/REF-Feld oben und Aktions-Buttons unten bleiben fix sichtbar;
       nur der Formularbereich dazwischen scrollt. Verhindert, dass der
       "Bestätigen"-Button verschwindet, wenn Tastatur/Adressleiste auf
       Mobilgeräten die sichtbare Fläche verkleinern. */
    #lookup-modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px 18px 16px;
      width: 100%;
      max-width: 420px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
    }

    .lookup-title {
      font-weight: 600;
      font-size: 1rem;
      color: #f1f5f9;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .ref-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .ref-label input {
      background: #0f172a;
      border: 1px solid #1e40af;
      border-radius: 4px;
      color: #f1f5f9;
      padding: 7px 10px;
      font-size: 14px;
      width: 100%;
    }

    #lookup-loading {
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      padding: 12px 0;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #lookup-form {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #lookup-form label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    #lookup-form input,
    #lookup-form select,
    #status-modal select {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #f1f5f9;
      padding: 7px 10px;
      font-size: 14px;
      width: 100%;
    }

    /* Inline "+ Neu…"-Eingabe (Kategorie/Hauptlieferant/Lagerort): ersetzt das
       Dropdown an Ort und Stelle, kein Popup. Wert bleibt editierbar und wird
       erst beim Speichern des Formulars angelegt. */
    .new-value-row {
      display: flex;
      gap: 6px;
    }
    .new-value-row input { flex: 1; }
    .new-value-back {
      background: #334155;
      border: none;
      border-radius: 4px;
      color: #cbd5e1;
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #lookup-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-shrink: 0;
    }

    #lookup-cancel-btn, #lookup-confirm-btn {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      color: #fff;
      flex: 1;
    }
    #lookup-cancel-btn  { background: #991b1b; }
    #lookup-confirm-btn { background: #15803d; }
    #lookup-confirm-btn:disabled { opacity: 0.4; cursor: default; }

    #lk-suggest-btn {
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      margin-top: 4px;
      cursor: pointer;
    }
    #lk-suggest-btn:disabled { opacity: 0.5; cursor: default; }
    #lk-suggest-status {
      font-size: 12px;
      color: #94a3b8;
      min-height: 1em;
      margin: 4px 0 8px;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    #loading-screen.hidden { display: none; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-msg { font-size: 0.9rem; color: #94a3b8; }
    #loading-progress {
      width: 200px;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-progress-bar {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      transition: width 0.3s;
    }

    #product-banner {
      display: none;
      width: 100%;
      max-width: 720px;
      background: #1d4ed8;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      gap: 6px;
      align-items: center;
    }

    #product-banner.visible { display: flex; }

    #product-banner-label {
      opacity: 0.75;
      font-weight: 400;
      flex-shrink: 0;
    }

    /* Debug overlay – only visible with ?debug in URL */
    #debug-overlay {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 45dvh;
      background: rgba(2, 6, 23, 0.97);
      border-top: 2px solid #334155;
      flex-direction: column;
      z-index: 200;
      font-family: monospace;
    }
    #debug-overlay.visible { display: flex; }

    #debug-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    #debug-toolbar span { font-size: 0.75rem; color: #94a3b8; flex: 1; }
    #debug-toolbar button {
      font-size: 0.7rem;
      padding: 4px 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
    }
    #debug-toolbar button.dbf-active {
      background: #334155;
      border-color: #64748b;
      color: #f1f5f9;
    }

    #debug-log {
      overflow-y: auto;
      flex: 1;
      padding: 6px 8px;
      font-size: 0.68rem;
      line-height: 1.5;
    }

    /* Mode-Selector (Wishlist Pkt. 1) */
    #mode-selector {
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 720px;
      padding: 24px 16px;
    }

    #mode-selector-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f1f5f9;
      text-align: center;
      margin-bottom: 8px;
    }

    .mode-btn {
      width: 100%;
      padding: 22px 16px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-btn.mode-add     { background: #065f46; }
    .mode-btn.mode-add:active     { background: #047857; }
    .mode-btn.mode-search  { background: #1e40af; }
    .mode-btn.mode-search:active  { background: #1e3a8a; }
    .mode-btn.mode-reorder { background: #b45309; }
    .mode-btn.mode-reorder:active { background: #92400e; }

    /* Status-Modal (Option B – Produkt gefunden) */
    #status-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 16px;
    }
    #status-modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px 18px 16px;
      width: 100%;
      max-width: 380px;
    }
    #status-label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
      margin: 14px 0 6px;
    }
    #status-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    #status-cancel-btn {
      background: #334155;
      flex: 1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    #status-confirm-btn {
      background: #1e40af;
      flex: 2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    #status-confirm-btn:disabled { opacity: 0.4; cursor: default; }

    /* REF-Duplikat-Meldung (Option A – REF bereits vorhanden) */
    #ref-exists-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 16px;
    }
    #ref-exists-modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px 18px 16px;
      width: 100%;
      max-width: 380px;
    }
    #ref-exists-text {
      font-size: 13px;
      color: #cbd5e1;
      margin: 10px 0 4px;
      line-height: 1.5;
    }
    #ref-exists-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    #ref-exists-actions-row {
      display: flex;
      gap: 8px;
    }
    .ref-exists-full-btn {
      background: #15803d;
      width: 100%;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    #ref-exists-back-btn {
      background: #334155;
      flex: 1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    #ref-exists-edit-btn {
      background: #1e40af;
      flex: 1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .log-entry { display: flex; gap: 6px; border-bottom: 1px solid #1e293b; padding: 2px 0; }
    .log-ts  { color: #475569; flex-shrink: 0; }
    .log-src { color: #7dd3fc; flex-shrink: 0; min-width: 60px; }
    .log-msg { color: #e2e8f0; word-break: break-all; }
    .log-entry.INFO  .log-level { color: #64748b; }
    .log-entry.WARN  .log-level { color: #f59e0b; }
    .log-entry.ERROR .log-level { color: #f87171; }
    .log-entry.ERROR .log-msg   { color: #fca5a5; }
    .log-level { flex-shrink: 0; min-width: 36px; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-msg">Starte…</div>
    <div id="loading-progress"><div id="loading-progress-bar"></div></div>
  </div>

  <div id="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/>
      <rect x="2" y="14" width="8" height="8" rx="1"/>
      <path d="M14 14h2v2h-2zM18 14h2M14 18v2M18 18h2v2h-2"/>
    </svg>
    <h1>Live OCR Scanner</h1>
  </div>

  <div id="product-banner">
    <span id="product-banner-label">Produkt:</span>
    <span id="product-banner-name"></span>
  </div>

  <div id="mode-selector" style="display:none">
    <h2 id="mode-selector-title">Was möchten Sie tun?</h2>
    <button id="mode-add"     class="mode-btn mode-add">Produkt hinzufügen</button>
    <button id="mode-search"  class="mode-btn mode-search">Produkt suchen</button>
    <button id="mode-reorder" class="mode-btn mode-reorder">Produkt nachbestellen</button>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="scan-overlay">
      <div id="scan-frame">
      </div>
    </div>
    <button id="cam-switch-btn" type="button">⟳ Kamera</button>
    <div id="zoom-wrap">
      <span>Zoom</span>
      <input id="zoom-range" type="range" min="0" max="1" step="0.1" value="0">
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="result-panel">
    <div id="status-bar">
      <div id="status-dot"></div>
      <span id="status-text">Initialisiere…</span>
    </div>

    <div id="mode-switcher">
      <button class="mode-switch-btn" data-mode="add" type="button">Hinzufügen</button>
      <button class="mode-switch-btn" data-mode="search" type="button">Suchen</button>
      <button class="mode-switch-btn" data-mode="reorder" type="button">Nachbestellen</button>
    </div>

    <div id="result-box">
      <div id="result-label">Erkannter Text</div>
      <div id="result-text">–</div>
    </div>
    <input id="search-ref-input" type="text" style="display:none" placeholder="REF prüfen/korrigieren">
    <div id="confidence-bar-wrap">
      <div id="confidence-bar"></div>
    </div>
    <div id="confidence-label"></div>

    <button id="scan-btn">Scannen</button>
    <button id="review-send-btn" style="display:none">Senden</button>
    <button id="review-retake-btn" style="display:none">Neu aufnehmen</button>
    <button id="send-btn" disabled>REF-Nr. hinzufügen</button>
    <button id="reorder-btn" style="display:none">Nachbestellen</button>
    <button id="search-confirm-btn" style="display:none">Suchen</button>
    <button id="lookup-btn" style="display:none">Neues Produkt anlegen</button>
    <div id="queue-info"></div>
    <div id="avail-panel" style="display:none">
      <div id="avail-list"></div>
    </div>
  </div>

  <div id="lookup-backdrop" style="display:none">
    <div id="lookup-modal">
      <div class="lookup-title" id="lookup-modal-title">Neues Produkt bestätigen</div>
      <label class="ref-label">REF-Nr. *<input id="lk-ref" type="text"></label>
      <div id="lookup-loading">Suche läuft…</div>
      <div id="lookup-form" style="display:none">
        <div id="lk-suggest-section">
          <label>Suchbegriff *<input id="lk-hersteller" type="text" placeholder="Hersteller eintippen"></label>
          <button id="lk-suggest-btn" type="button">Vorschlag laden</button>
          <div id="lk-suggest-status"></div>
        </div>
        <label>Hersteller<input id="lk-manu" type="text"></label>
        <label>Artikelname *<input id="lk-name" type="text" required></label>
        <label>Kategorie
          <select id="lk-cat"><option value="">– bitte wählen –</option></select>
          <div id="lk-cat-new" class="new-value-row" style="display:none">
            <input id="lk-cat-new-input" type="text" placeholder="Neue Kategorie eingeben">
            <button type="button" id="lk-cat-new-back" class="new-value-back">Liste</button>
          </div>
        </label>
        <label>Hauptlieferant
          <select id="lk-sup"><option value="">– bitte wählen –</option></select>
          <div id="lk-sup-new" class="new-value-row" style="display:none">
            <input id="lk-sup-new-input" type="text" placeholder="Neuen Lieferanten eingeben">
            <button type="button" id="lk-sup-new-back" class="new-value-back">Liste</button>
          </div>
        </label>
        <label>Lagerort
          <select id="lk-loc"><option value="">– bitte wählen –</option></select>
          <div id="lk-loc-new" class="new-value-row" style="display:none">
            <input id="lk-loc-new-input" type="text" placeholder="Neuen Lagerort eingeben">
            <button type="button" id="lk-loc-new-back" class="new-value-back">Liste</button>
          </div>
        </label>
        <label>Bestellstatus<select id="lk-status"><option value="">– bitte wählen –</option></select></label>
      </div>
      <div id="lookup-actions">
        <button id="lookup-cancel-btn" class="btn-secondary">Abbrechen</button>
        <button id="lookup-confirm-btn" class="btn-primary" style="display:none">Bestätigen</button>
      </div>
    </div>
  </div>

  <div id="status-backdrop" style="display:none">
    <div id="status-modal">
      <div class="lookup-title">Bestellstatus setzen</div>
      <label id="status-label">Status
        <select id="status-select"></select>
      </label>
      <div id="status-actions">
        <button id="status-cancel-btn">Abbrechen</button>
        <button id="status-confirm-btn">Speichern</button>
      </div>
    </div>
  </div>

  <div id="ref-exists-backdrop" style="display:none">
    <div id="ref-exists-modal">
      <div class="lookup-title">REF bereits vorhanden</div>
      <div id="ref-exists-text"></div>
      <div id="ref-exists-actions">
        <button id="ref-exists-check-btn" class="ref-exists-full-btn">Produkteigenschaften überprüfen</button>
        <div id="ref-exists-actions-row">
          <button id="ref-exists-back-btn">Zurück zum Scannen</button>
          <button id="ref-exists-edit-btn">REF bearbeiten</button>
        </div>
      </div>
    </div>
  </div>

  <div id="debug-overlay">
    <div id="debug-toolbar">
      <span>Debug-Log (<span id="debug-count">0</span> Einträge)</span>
      <button id="debug-filter-all" class="dbf-active">ALL</button>
      <button id="debug-filter-warn">WARN+</button>
      <button id="debug-filter-error">ERROR</button>
      <button id="debug-export">Export JSON</button>
      <button id="debug-clear">Leeren</button>
      <button id="debug-close">✕</button>
    </div>
    <div id="debug-log"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
